<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global IPTV Dashboard</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-color: #1e1e1e;
            --accent-color: #00adb5;
            --text-color: #eeeeee;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 800px;
        }
        .frame-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* Fixed 16:9 Aspect Ratio */
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }
        .frame-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            width: 100%;
        }
        select {
            flex: 1;
            padding: 12px;
            background-color: var(--card-color);
            color: var(--text-color);
            border: 1px solid #333;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
        }
        .channel-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 5px;
        }
        .channel-card {
            background-color: var(--card-color);
            border: 1px solid #2d2d2d;
            border-radius: 6px;
            padding: 15px 10px;
            text-align: center;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: transform 0.1s, border-color 0.2s;
            word-wrap: break-word;
        }
        .channel-card:hover, .channel-card:active {
            border-color: var(--accent-color);
            transform: scale(1.02);
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Shared Viewport Frame Hub -->
    <div class="frame-container">
        <iframe id="mainViewer" src="player.html" allow="autoplay; fullscreen"></iframe>
    </div>

    <!-- Category Dropdown Picker -->
    <div class="controls">
        <select id="categorySelector" onchange="filterCategory()">
            <option value="all">🌐 All Channels</option>
            <option value="live">📺 Live Streams (YouTube / SGPC)</option>
            <option value="nz">🇳🇿 IPTV New Zealand</option>
            <option value="india">🇮🇳 IPTV India</option>
        </select>
    </div>

    <!-- Channel Cards Output List -->
    <div id="channelGrid" class="channel-grid"></div>
</div>

<script>
    // Managed Multi-Link Database Configuration
    const channels = [
        { 
            name: "🪔 SGPC Amritsar Live", 
            category: "live", 
            type: "youtube",
            // Priority 1: Direct fallback embedded layout player URL
            url1: "https://youtube.com", 
            // Priority 2: Alternative backup layout link wrapper
            url2: "https://youtube.com" 
        },
        { 
            name: "🔴 Sky News Live", 
            category: "live", 
            type: "youtube",
            url1: "https://youtube.com",
            url2: "https://youtube.com"
        },
        { 
            name: "🇳🇿 TVNZ 1 (IPTV)", 
            category: "nz", 
            type: "m3u8",
            url1: "https://githubusercontent.com", 
            url2: "https://iptv-org.github.io/iptv/countries/nz.m3u" 
        },
        { 
            name: "🇳🇿 Three (IPTV)", 
            category: "nz", 
            type: "m3u8",
            url1: "https://iptv-org.github.io/iptv/countries/nz.m3u",
            url2: "https://githubusercontent.com"
        },
        { 
            name: "🇮🇳 DD National (IPTV)", 
            category: "india", 
            type: "m3u8",
            url1: "https://github.io", 
            url2: "https://githubusercontent.com" 
        },
        { 
            name: "🇮🇳 Aaj Tak (IPTV)", 
            category: "india", 
            type: "m3u8",
            url1: "https://github.io",
            url2: "https://githubusercontent.com"
        }
    ];

    const viewer = document.getElementById('mainViewer');
    const grid = document.getElementById('channelGrid');

    function renderChannels(list) {
        grid.innerHTML = "";
        list.forEach(chan => {
            const card = document.createElement('div');
            card.className = 'channel-card';
            card.innerText = chan.name;
            // Primary click triggers the priority link; right-click/long-press can use backup
            card.onclick = () => loadMedia(chan.url1, chan.type);
            card.oncontextmenu = (e) => {
                e.preventDefault();
                loadMedia(chan.url2, chan.type);
            };
            grid.appendChild(card);
        });
    }

    function loadMedia(streamUrl, type) {
        if (type === "youtube") {
            // Bypass internal media engines; paint YouTube iframe cleanly
            viewer.src = streamUrl;
        } else {
            // Ensure core layout environment points back to internal structural baseline player
            if (!viewer.src.includes("player.html")) {
                viewer.src = "player.html";
                // Wait for document layout to mount before firing postMessage
                viewer.onload = () => sendToPlayer(streamUrl);
            } else {
                sendToPlayer(streamUrl);
            }
        }
    }

    function sendToPlayer(url) {
        viewer.contentWindow.postMessage({
            type: "LOAD_STREAM",
            url: url
        }, "*");
    }

    function filterCategory() {
        const value = document.getElementById('categorySelector').value;
        if (value === "all") {
            renderChannels(channels);
        } else {
            const filtered = channels.filter(c => c.category === value);
            renderChannels(filtered);
        }
    }

    // Initialize application layout display
    renderChannels(channels);
</script>
</body>
</html>
