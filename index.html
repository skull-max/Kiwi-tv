<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Universal Multi-Source Matrix</title>
    <style>
        /* CSS rules preventing touch-scaling glitches on mobile or tablet layouts */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: #0c0c11;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* 1. STICKY TOP SCREEN: Locks your visual TV player neatly at the top of your tablet screen */
        .screen-container {
            width: 100%;
            aspect-ratio: 16/9;
            background-color: #000000;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* 2. LOWER TOUCH ZONE: Grid items scroll completely free underneath the stream screen */
        .scrollable-channels {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            padding-bottom: 60px;
            -webkit-overflow-scrolling: touch;
        }

        .category-title {
            font-size: 11px;
            color: #888892;
            margin-bottom: 10px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #22222b;
            padding-bottom: 4px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* Creates two columns for phones/tablets */
            gap: 12px;
            margin-bottom: 25px;
        }

        .channel-card {
            background-color: #171722;
            border: 1px solid #29293a;
            border-radius: 12px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn-play {
            background-color: #252538;
            color: #ffffff;
            border: 1px solid #3d3d5c;
            padding: 15px 5px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
        }

        .btn-play:active {
            background-color: #3b82f6;
        }

        .source-selector {
            background-color: #0d0d14;
            color: #a1a1aa;
            border: 1px solid #29293a;
            padding: 8px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 6px;
            width: 100%;
            outline: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- VISUAL MEDIA PLAYER DISPLAY CONTAINER -->
    <div class="screen-container">
        <!-- Built using the exact same secure link structure that successfully played your SGPC stream -->
        <iframe id="youtube-engine-display" src="https://youtube.com" allowfullscreen allow="autoplay; encrypted-media"></iframe>
    </div>

    <!-- LOWER SELECTION MATRIX -->
    <div class="scrollable-channels">

        <div class="category-title">📺 Multi-Source Channel Matrix (4 Links Each)</div>
        <div class="grid">

            <!-- CARD MODULE 1: SGPC LIVE -->
            <div class="channel-card">
                <button class="btn-play" onclick="tuneMatrixChannel('sgpc')">✨ SGPC Live</button>
                <select id="src-sgpc" class="source-selector">
                    <option value="FMQ3uVD6jX8">Source 1: Daily Live Main</option>
                    <option value="ANwqeF-PW1g">Source 2: Morning Session</option>
                    <option value="UDqpLH181Dw">Source 3: Evening Session</option>
                    <option value="oo9AUNyBJjg">Source 4: Backup Stream</option>
                </select>
            </div>

            <!-- CARD MODULE 2: PTC PUNJABI NEWS -->
            <div class="channel-card">
                <button class="btn-play" onclick="tuneMatrixChannel('ptc')">🎵 PTC News Live</button>
                <select id="src-ptc" class="source-selector">
                    <option value="1zqa-He6NXg">Source 1: Active Stream</option>
                    <option value="bvRiRnRX4ko">Source 2: Backup Loop 1</option>
                    <option value="VBFMudrPB-A">Source 3: Backup Loop 2</option>
                    <option value="2sDz6MMgfU0">Source 4: Regional Stream</option>
                </select>
            </div>

            <!-- CARD MODULE 3: GLOBAL CHANNELS -->
            <div class="channel-card">
                <button class="btn-play" onclick="tuneMatrixChannel('skynews')">🇬🇧 Sky News</button>
                <select id="src-skynews" class="source-selector">
                    <option value="9Auqeyv765k">Source 1: International Live</option>
                    <option value="qhnX4jA0A5paNd1v-zEysw">Source 2: Network Feed</option>
                    <option value="v=9Auqeyv765k">Source 3: Backup Stream</option>
                    <option value="FMQ3uVD6jX8">Source 4: SGPC Devotional</option>
                </select>
            </div>

            <!-- CARD MODULE 4: POPULAR FREE CHANNELS -->
            <div class="channel-card">
                <button class="btn-play" onclick="tuneMatrixChannel('aajtak')">🔥 Aaj Tak</button>
                <select id="src-aajtak" class="source-selector">
                    <option value="Nq2wYlWFucg">Source 1: Live Main Feed</option>
                    <option value="e1FIApIafWE">Source 2: India TV Live</option>
                    <option value="sYZtOFzM78M">Source 3: India Today Feed</option>
                    <option value="1zqa-He6NXg">Source 4: PTC News Backup</option>
                </select>
            </div>

        </div>

    </div>

    <!-- CORE INTERNAL LOGIC ENGINE -->
    <script>
        const ytIframe = document.getElementById('youtube-engine-display');

        // Master routing controller
        function tuneMatrixChannel(channelKey) {
            // Step 1: Grabs whichever specific drop-down item is selected for the targeted channel card
            const dropdownElement = document.getElementById('src-' + channelKey);
            const chosenVideoId = dropdownElement.value;

            // Step 2: Instantly injects the clean ID using your verified functional string structure
            ytIframe.src = "https://youtube.com" + chosenVideoId + "?autoplay=1&mute=0&rel=0";
        }
    </script>
</body>
</html>
