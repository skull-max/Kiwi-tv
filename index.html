<!DOCTYPE html>
<html lang="en-NZ">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiwi Freeview Hub</title>
    <!-- We bring back the specialized Video JS video engine -->
    <link href="https://zencdn.net" rel="stylesheet" />
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            margin-bottom: 20px;
            font-size: 24px;
        }
        .video-box {
            width: 100%;
            max-width: 800px;
            margin-bottom: 25px;
            border-radius: 12px;
            overflow: hidden;
            background-color: #000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }
        .video-js {
            width: 100%;
            aspect-ratio: 16/9;
        }
        .grid-layout {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 12px;
            width: 100%;
            max-width: 800px;
        }
        .btn-channel {
            background-color: #242424;
            color: white;
            border: 2px solid #3a3a3a;
            padding: 20px 10px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.1s;
        }
        .btn-channel:active {
            background-color: #0084ff;
            border-color: #ffffff;
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <h1>🇳🇿 Kiwi Freeview Hub</h1>

    <div class="video-box">
        <video id="tv-player" class="video-js vjs-default-skin" controls preload="auto">
            <!-- Defaults to TVNZ 1 on start -->
            <source src="https://mjh.nz" type="application/x-mpegURL">
        </video>
    </div>

    <div class="grid-layout">
        <!-- We use the precise streaming database feeds provided by Matt Huisman -->
        <button class="btn-channel" onclick="tuneChannel('https://mjh.nz')">TVNZ 1</button>
        <button class="btn-channel" onclick="tuneChannel('https://mjh.nz')">Three</button>
        <button class="btn-channel" onclick="tuneChannel('https://mjh.nz')">Bravo</button>
        <button class="btn-channel" onclick="tuneChannel('https://mjh.nz')">Māori TV</button>
        <button class="btn-channel" onclick="tuneChannel('https://mjh.nz')">Sky Open</button>
        <button class="btn-channel" onclick="tuneChannel('https://mjh.nz')">Rush</button>
    </div>

    <!-- Load the video player script engine from the cloud -->
    <script src="https://zencdn.net"></script>
    <script>
        var player = videojs('tv-player');

        function tuneChannel(streamUrl) {
            player.src({
                src: streamUrl,
                type: 'application/x-mpegURL'
            });
            player.play();
        }
    </script>
</body>
</html>
