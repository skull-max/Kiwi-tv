<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Live TV Portal</title>
    <!-- Embedded Native Streaming Engine -->
    <script src="https://jsdelivr.net"></script>
    <style>
        :root {
            --bg: #0f0f15;
            --surface: #1a1a24;
            --accent: #ff4a5a;
            --accent-glow: rgba(255, 74, 90, 0.4);
            --text: #ffffff;
            --muted: #8a8a9e;
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 750px;
        }
        .video-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* Fixed 16:9 Cinema Aspect Ratio */
            background: #000000;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            border: 1px solid #2a2a3a;
            overflow: hidden;
        }
        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #1e1e2d 0%, #0f0f15 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            box-sizing: border-box;
            text-align: center;
        }
        .overlay-screen img {
            max-height: 60px;
            margin-bottom: 15px;
            border-radius: 6px;
        }
        .overlay-screen p {
            font-size: 16px;
            color: var(--muted);
            margin: 0 0 20px 0;
            max-width: 80%;
        }
        .launch-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 28px;
            background: #ff0000;
            color: #ffffff;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 4px 15px rgba(255,0,0,0.4);
            transition: transform 0.2s;
        }
        .launch-btn:active {
            transform: scale(0.95);
        }
        .grid-header {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent);
            margin-bottom: 10px;
            text-align: left;
            font-weight: 700;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px;
            margin-bottom: 25px;
        }
        .card {
            background: var(--surface);
            border: 1px solid #252535;
            border-radius: 8px;
            padding: 12px 8px;
            cursor: pointer;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .card img {
            width: auto;
            height: 32px;
            object-fit: contain;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }
        .card span {
            font-size: 13px;
            font-weight: 500;
            line-height: 1.3;
        }
        .card:active {
            border-color: var(--accent);
            box-shadow: 0 0 10px var(--accent-glow);
            background: #202030;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <!-- Fail-Safe Media Screen Hub -->
    <div class="video-container">
        <video id="liveEnginePlayer" controls autoplay playsinline></video>
        <div id="noticeOverlay" class="overlay-screen">
            <img id="overlayLogo" src="" class="hidden" alt="Logo">
            <h2 id="overlayTitle" style="margin: 0 0 10px 0;">TV Portal Standby</h2>
            <p id="overlayMessage">Select any channel from your playlist below to initialize the live streaming playback loop.</p>
            <a id="externalTrigger" href="#" target="_blank" class="launch-btn hidden">▶ Open Live Channel</a>
        </div>
    </div>

    <!-- Playlist Category Grid -->
    <div class="grid-header">🇮🇳 India Broadcasts (Direct IPTV)</div>
    <div class="grid">
        <div class="card" onclick="streamHLS('NDTV India', 'https://akamaized.net', 'https://imgur.com')">
            <img src="https://imgur.com" onerror="this.style.display='none'">
            <span>NDTV India</span>
        </div>
        <div class="card" onclick="streamHLS('ABP News', 'https://cloudfront.net', 'https://imgur.com')">
            <img src="https://imgur.com" onerror="this.style.display='none'">
            <span>ABP News</span>
        </div>
        <div class="card" onclick="streamHLS('ABP Ananda', 'https://cloudfront.net', 'https://wikimedia.org')">
            <img src="https://wikimedia.org" onerror="this.style.display='none'">
            <span>ABP Ananda</span>
        </div>
    </div>

    <div class="grid-header">📺 YouTube Live Feeds (Bypass Engine)</div>
    <div class="grid">
        <div class="card" onclick="streamYouTube('DD National', 'https://youtube.com', 'https://imgur.com')">
            <img src="https://imgur.com" onerror="this.style.display='none'">
            <span>DD National</span>
        </div>
        <div class="card" onclick="streamYouTube('DD News', 'https://youtube.com', 'https://imgur.com')">
            <img src="https://imgur.com" onerror="this.style.display='none'">
            <span>DD News</span>
        </div>
        <div class="card" onclick="streamYouTube('DD India', 'https://www.youtube.com/DDIndia/live', 'https://i.imgur.com/45uptR8.png')">
            <img src="https://i.imgur.com/45uptR8.png" onerror="this.style.display='none'">
            <span>DD India</span>
        </div>
        <div class="card" onclick="streamYouTube('DD Bharati', 'https://youtube.com', 'https://imgur.com')">
            <img src="https://imgur.com" onerror="this.style.display='none'">
            <span>DD Bharati</span>
        </div>
        <div class="card" onclick="streamYouTube('DD Kisan', 'https://youtube.com', 'https://imgur.com')">
            <img src="https://imgur.com" onerror="this.style.display='none'">
            <span>DD Kisan</span>
        </div>
    </div>
</div>

<script>
    const video = document.getElementById('liveEnginePlayer');
    const overlay = document.getElementById('noticeOverlay');
    const oTitle = document.getElementById('overlayTitle');
    const oMessage = document.getElementById('overlayMessage');
    const oLogo = document.getElementById('overlayLogo');
    const extBtn = document.getElementById('externalTrigger');
    let hlsInstance = null;

    function wipeCanvas() {
        if (hlsInstance) {
            hlsInstance.destroy();
            hlsInstance = null;
        }
        video.src = "";
        video.classList.add('hidden');
        overlay.classList.remove('hidden');
        extBtn.classList.add('hidden');
        oLogo.classList.add('hidden');
    }

    // Direct HLS Handler
    function streamHLS(name, url, logoUrl) {
        wipeCanvas();
        overlay.classList.add('hidden');
        video.classList.remove('hidden');

        if (Hls.isSupported()) {
            hlsInstance = new Hls({
                enableWorker: true,
                lowLatencyMode: true
            });
            hlsInstance.loadSource(url);
            hlsInstance.attachMedia(video);
            hlsInstance.on(Hls.Events.ERROR, function(event, data) {
                if (data.fatal) {
                    showFallbackMessage(name, "This specific IPTV stream link is offline or geographically region-locked.", logoUrl);
                }
            });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = url;
        } else {
            showFallbackMessage(name, "Your local browser configuration does not feature standard HLS capabilities.", logoUrl);
        }
    }

    // Bulletproof YouTube Redirect Engine
    function streamYouTube(name, url, logoUrl) {
        wipeCanvas();
        oTitle.innerText = name;
        oMessage.innerText = "To bypass modern tablet browser connection locks, launch this active YouTube Live broadcast network safely in your dedicated application container:";
        
        if(logoUrl) {
            oLogo.src = logoUrl;
            oLogo.classList.remove('hidden');
        }
        
        extBtn.href = url;
        extBtn.classList.remove('hidden');
    }

    function showFallbackMessage(title, text, logoUrl) {
        wipeCanvas();
        oTitle.innerText = title;
        oMessage.innerText = text;
