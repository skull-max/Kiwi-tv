<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lightweight Free TV Hub</title>
    <style>
        /* CSS reset rules ensuring full split-screen scaling */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: #0d0d11;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* TOP SCREEN PORTAL: Widescreen box locked to the top of your tablet view */
        .screen-container {
            width: 100%;
            aspect-ratio: 16/9;
            background-color: #000000;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* SCROLLABLE GRID ZONE: Layout wrapper for elements underneath the player */
        .scrollable-channels {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            padding-bottom: 50px;
            -webkit-overflow-scrolling: touch;
        }

        .category-title {
            font-size: 11px;
            color: #888892;
            margin-bottom: 8px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr; /* Single column for a clean full-width button layout */
            gap: 10px;
            margin-bottom: 25px;
        }

        .btn {
            color: #ffffff;
            border: 1px solid #282835;
            padding: 18px 10px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            transition: background-color 0.1s;
        }

        .btn-yt { 
            background-color: #1f1212; 
            border-left: 4px solid #ef4444; 
        }

        .btn:active {
            background-color: #272736;
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <!-- VISUAL MEDIA PLAYER DISPLAY STAGE -->
    <div class="screen-container">
        <!-- PERMANENT FIX: Uses un-expiring channel live parameter logic to initialize instantly on page load -->
        <iframe id="display-viewport" src="https://youtube.com" allowfullscreen allow="autoplay; encrypted-media"></iframe>
    </div>

    <!-- LOWER SCROLL ZONE -->
    <div class="scrollable-channels">

        <div class="category-title">📺 Native Live Streams (Plays Above)</div>
        <div class="grid">
            <!-- DYNAMIC LAUNCHER BUTTON: Automatically tracks down whichever stream key is running -->
            <button class="btn btn-yt" onclick="playSGPCLive()">✨ SGPC Live</button>
        </div>

    </div>

    <!-- CONTROL MACHINE ROUTER LOGIC -->
    <script>
        const webView = document.getElementById('display-viewport');

        // ROUTER: Dynamically points to the live feed container of the SGPC official channel profile ID
        function playSGPCLive() {
            webView.src = "https://youtube.com";
        }
    </script>

</body>
</html>
