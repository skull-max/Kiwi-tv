<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV Control Board</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0b0b12;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 650px;
        }
        .frame-box {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* Fixed 16:9 Screen Dimension */
            background: #000000;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border: 1px solid #1f1f2e;
        }
        .frame-box iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        .dashboard-panel {
            background-color: #14141f;
            border-radius: 10px;
            padding: 20px;
            border: 1px solid #252538;
            text-align: center;
        }
        h2 {
            margin: 0 0 5px 0;
            font-size: 22px;
            color: #f39c12;
        }
        .instruction {
            color: #8a8a9e;
            font-size: 14px;
            margin: 0 0 20px 0;
        }
        .btn-stack {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .control-btn {
            background: #1e1e2d;
            border: 1px solid #32324d;
            color: #ffffff;
            padding: 16px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background 0.2s, border-color 0.2s;
        }
        .control-btn:active {
            background: #f39c12;
            color: #000000;
            border-color: #f39c12;
        }
        .badge {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- PERSISTENT VISUAL VIEWPORT WRAPPER FRAME -->
    <div class="frame-box">
        <iframe id="playerFrame" src="player.html" allow="autoplay; fullscreen; encrypted-media; picture-in-picture"></iframe>
    </div>

    <!-- INPUT ROUTER HOOK -->
    <div class="dashboard-panel">
        <h2>🪔 SGPC Sri Amritsar Live Portal</h2>
        <p class="instruction">Choose an engine layout below. This injects the live data feeds directly into your target frame environment:</p>
        
        <div class="btn-stack">
            <!-- OPTION 1: Fully Authorized YouTube Live Embed Video ID for SGPC Amritsar (Bypasses Vercel Domain Blocks) -->
            <button class="control-btn" onclick="injectStream('youtube', 'https://youtube.com')">
                <span>Option 1: Play via YouTube Live Engine</span>
                <span class="badge" style="background:#e74c3c; color: #fff;">YouTube</span>
            </button>
            
            <!-- OPTION 2: Open-Permission CORS Verified Live Broadcast Stream (Bypasses Security Firewall Blocks) -->
            <button class="control-btn" onclick="injectStream('iptv', 'https://b-cdn.net')">
                <span>Option 2: Play via IPTV Playlist Codec</span>
                <span class="badge" style="background:#2ecc71; color: #000;">M3U8 Direct</span>
            </button>
        </div>
    </div>
</div>

<script>
    function injectStream(type, url) {
        const frame = document.getElementById('playerFrame');
        // Instantly re-routes the layout parameters via a localized secure URL parameter string
        frame.src = `player.html?type=${type}&url=${encodeURIComponent(url)}`;
    }
</script>

</body>
</html>
