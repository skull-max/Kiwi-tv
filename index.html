<!DOCTYPE html>
<html lang="en-NZ">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiwi Freeview Hub</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            margin-top: 10px;
            margin-bottom: 5px;
            font-size: 26px;
        }
        p {
            color: #888888;
            margin-bottom: 25px;
            text-align: center;
            font-size: 14px;
        }
        /* Layout Grid for TV Channels */
        .grid-layout {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            width: 100%;
            max-width: 600px;
            margin-bottom: 30px;
        }
        .btn-channel {
            background-color: #1e1e1e;
            color: white;
            border: 2px solid #333333;
            padding: 25px 15px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        /* Distinct visual cue for third-party platforms */
        .btn-external {
            background-color: #1c2d42;
            border-color: #3b5998;
        }
        .btn-channel:active {
            background-color: #0084ff;
            border-color: #ffffff;
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <h1>🇳🇿 Kiwi Freeview Hub</h1>
    <p>Select a source to launch streaming playback safely without browser blocks.</p>

    <!-- LIVE TV SELECTION PLATFORMS -->
    <div class="grid-layout">
        <!-- Official Free-to-Air web stream pages optimized for mobile browsers -->
        <button class="btn-channel" onclick="launchStream('https://tvnz.co.nz')">TVNZ 1</button>
        <button class="btn-channel" onclick="launchStream('https://tvnz.co.nz')">TVNZ 2</button>
        <button class="btn-channel" onclick="launchStream('https://threenow.co.nz')">Three</button>
        <button class="btn-channel" onclick="launchStream('https://threenow.co.nz')">Bravo</button>
        
        <!-- Linking your experimental alternative streaming site directly -->
        <button class="btn-channel btn-external" onclick="launchStream('https://vidbox.vc/live-tv')">VidBox TV 🌐</button>
    </div>

    <script>
        // JavaScript launcher script 
        function launchStream(targetUrl) {
            // '_blank' instructs the browser engine to deploy a clean tab 
            // bypassing parent frame sandboxes and avoiding the sad-face block
            window.open(targetUrl, '_blank');
        }
    </script>
</body>
</html>
