<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Universal Multi-Source Matrix</title>
    
    <!-- Programmatic HLS stream unpacker engine used to load direct CDN links natively -->
    <script src="https://jsdelivr.net"></script>

    <style>
        /* CSS reset layout constraints preventing touch-scaling glitches */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: #0c0c11;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* 1. VIEWPORT LAYOUT: Keeps your media window cleanly locked on top */
        .screen-container {
            width: 100%;
            aspect-ratio: 16/9;
            background-color: #000000;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }

        video, iframe {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
            display: none;
        }

        /* 2. LOWER TOUCH SECTION: Grid items scroll completely free underneath the stream screen */
        .scrollable-channels {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            padding-bottom: 50px;
            -webkit-overflow-scrolling: touch;
        }

        .category-title {
            font-size: 11px;
            color: #888892;
            margin-bottom: 10px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #22222b;
            padding-bottom: 4px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 25px;
        }

        .channel-card {
            background-color: #171722;
            border: 1px solid #29293a;
            border-radius: 12px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn-play {
            background-color: #252538;
            color: #ffffff;
            border: 1px solid #3d3d5c;
            padding: 15px 5px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
        }

        .btn-play:active {
            background-color: #3b82f6;
        }

        .source-selector {
            background-color: #0d0d14;
            color: #a1a1aa;
            border: 1px solid #29293a;
            padding: 8px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 6px;
            width: 100%;
            outline: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- VISUAL MEDIA PLAYER DISPLAY STAGE -->
    <div class="screen-container">
        <video id="native-engine-display" controls autoplay playsinline></video>
        <iframe id="youtube-engine-display" allowfullscreen allow="autoplay; encrypted-media"></iframe>
    </div>

    <!-- LOWER SELECTION MATRIX -->
    <div class="scrollable-channels">

        <div class="category-title">📺 Multi-Source Channel Matrix (4 Links Each)</div>
        <div class="grid">

            <!-- CARD MODULE 1: SGPC LIVE -->
            <div class="channel-card">
                <button class="btn-play" onclick="tuneMatrixChannel('sgpc')">✨ SGPC Live</button>
                <select id="src-sgpc" class="source-selector">
                    <option value="yt_live:UCkA21M22vGK9GtAvq3DvSlA">Source 1: Official Channel Feed</option>
                    <option value="yt_vid:Qv2eRRU_56A">Source 2: Direct Video Link</option>
                    <option value="m3u:https://mux.dev">Source 3: Test Loop 1</option>
                    <option value="m3u:https://longtailvideo.com">Source 4: Test Loop 2</option>
                </select>
            </div>

            <!-- CARD MODULE 2: PTC PUNJABI -->
            <div class="channel-card">
                <button class="btn-play" onclick="tuneMatrixChannel('ptc')">🎵 PTC Punjabi</button>
                <select id="src-ptc" class="source-selector">
                    <option value="yt_live:UCHJW1_0oPzYZl89wX_jhrgA">Source 1: Official Channel Feed</option>
                    <option value="yt_vid:b2_x60nNf7o">Source 2: Direct Video Link</option>
                    <option value="m3u:https://akamaized.net">Source 3: Indian CDN Network</option>
                    <option value="m3u:https://mux.dev">Source 4: Test Video Loop</option>
                </select>
            </div>

            <!-- CARD MODULE 3: GLOBAL MEDIA -->
            <div class="channel-card">
                <button class="btn-play" onclick="tuneMatrixChannel('skynews')">🇬🇧 Sky News</button>
                <select id="src-skynews" class="source-selector">
                    <option value="yt_live:UCqhnX4jA0A5paNd1v-zEysw">Source 1: Official Channel Feed</option>
                    <option value="m3u:https://akamaized.net">Source 2: NASA TV Public</option>
                    <option value="m3u:https://akamaized.net">Source 3: NHK World CDN</option>
                    <option value="m3u:https://mux.dev">Source 4: Test Video Loop</option>
                </select>
            </div>

            <!-- CARD MODULE 4: ENTERTAINMENT & SPORT -->
            <div class="channel-card">
                <button class="btn-play" onclick="tuneMatrixChannel('redbull')">🏎️ Red Bull TV</button>
                <select id="src-redbull" class="source-selector">
                    <option value="m3u:https://amagi.tv">Source 1: IPTV CDN Link</option>
                    <option value="m3u:https://mux.dev">Source 2: Mux Stream Test</option>
                    <option value="m3u:https://longtailvideo.com">Source 3: BipBop Engine Feed</option>
                    <option value="yt_vid:Qv2eRRU_56A">Source 4: Devotional Backup</option>
                </select>
            </div>

        </div>

    </div>

    <!-- CORE INTERNAL INTERFACE LOGIC ENGINE -->
    <script>
        const cdnVideo = document.getElementById('native-engine-display');
        const ytIframe = document.getElementById('youtube-engine-display');
        let activeHlsLinkInstance = null;

        function resetActiveViewports() {
            if (activeHlsLinkInstance) {
                activeHlsLinkInstance.destroy();
                activeHlsLinkInstance = null;
            }
            cdnVideo.style.display = 'none';
            cdnVideo.pause();
            cdnVideo.src = '';
            
            ytIframe.style.display = 'none';
            ytIframe.src = '';
        }

        function tuneMatrixChannel(channelKey) {
            resetActiveViewports();
            
            const dropdownElement = document.getElementById('src-' + channelKey);
            const chosenValue = dropdownElement.value;

            // Route Type A: Permanent Unexpiring Live Channel ID Feed
            if (chosenValue.startsWith('yt_live:')) {
                const channelId = chosenValue.substring(8); 
                ytIframe.style.display = 'block';
                ytIframe.src = "https://youtube.com" + channelId + "&autoplay=1&mute=0&rel=0";
            } 
            // Route Type B: Direct Explicit Video ID Feed
            else if (chosenValue.startsWith('yt_vid:')) {
                const videoId = chosenValue.substring(7); 
                ytIframe.style.display = 'block';
                ytIframe.src = "https://youtube.com" + videoId + "?autoplay=1&mute=0&rel=0";
            } 
            // Route Type C: Internal HLS Stream Player for CDN Nodes
            else if (chosenValue.startsWith('m3u:')) {
                const streamUrl = chosenValue.substring(4); 
                cdnVideo.style.display = 'block';

                if (Hls.isSupported()) {
                    activeHlsLinkInstance = new Hls();
                    activeHlsLinkInstance.loadSource(streamUrl);
                    activeHlsLinkInstance.attachMedia(cdnVideo);
                    activeHlsLinkInstance.on(Hls.Events.MANIFEST_PARSED, function() {
                        cdnVideo.play().catch(err => console.log("Blocked browser autoplay safety trigger."));
                    });
                } else if (cdnVideo.canPlayType('application/x-mpegURL')) {
                    cdnVideo.src = streamUrl;
                    cdnVideo.play();
                }
            }
        }

        // Auto-run SGPC channel choice when the portal opens
        tuneMatrixChannel('sgpc');
    </script>
</body>
</html>
