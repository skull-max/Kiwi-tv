<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Open Stream Player</title>
    <!-- We load HLS-supported video script libraries so .m3u8 plays natively -->
    <link href="https://zencdn.net" rel="stylesheet" />
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { margin-bottom: 20px; font-size: 24px; }
        .video-box {
            width: 100%;
            max-width: 800px;
            margin-bottom: 25px;
            border-radius: 12px;
            overflow: hidden;
            background-color: #000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }
        .video-js { width: 100%; aspect-ratio: 16/9; }
        .grid-layout {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            width: 100%;
            max-width: 800px;
        }
        .btn-channel {
            background-color: #242424;
            color: white;
            border: 2px solid #3a3a3a;
            padding: 20px 10px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.1s;
        }
        .btn-channel:active {
            background-color: #0084ff;
            border-color: #ffffff;
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <h1>🌐 Public Direct-Link Player</h1>

    <div class="video-box">
        <video id="live-player" class="video-js vjs-default-skin" controls preload="auto">
            <!-- Starting default: NASA TV (A completely public, direct unblocked HLS stream) -->
            <source src="https://akamaized.net" type="application/x-mpegURL">
        </video>
    </div>

    <div class="grid-layout">
        <!-- These are direct streams from github.com/iptv-org that allow open web browser playback -->
        <button class="btn-channel" onclick="tuneChannel('https://akamaized.net')">NASA TV 🚀</button>
        <button class="btn-channel" onclick="tuneChannel('https://amagi.tv')">Red Bull TV 🏎️</button>
        <button class="btn-channel" onclick="tuneChannel('https://akamaized.net')">CNBC Global 📈</button>
        <button class="btn-channel" onclick="tuneChannel('https://akamaized.net')">NHK World 🇯🇵</button>
    </div>

    <script src="https://zencdn.net"></script>
    <script>
        // Initialize player engine
        var player = videojs('live-player');

        function tuneChannel(streamUrl) {
            player.src({
                src: streamUrl,
                type: 'application/x-mpegURL'
            });
            player.play();
        }
    </script>
</body>
</html>
