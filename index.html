<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Universal TV Terminal</title>
    
    <!-- Heavy-duty HLS stream decoding engine to read raw .m3u8 streams internally -->
    <script src="https://jsdelivr.net"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: #0c0c10;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* 1. FIXED TOP SCREEN DISPLAY: Frozen on top of mobile or tablet viewports */
        .video-viewport-stage {
            width: 100%;
            aspect-ratio: 16/9;
            background-color: #000000;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }

        video, iframe {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
            display: none;
        }

        /* 2. SCROLLABLE ENGINE SELECTION: Scrolls seamlessly underneath the screen player */
        .main-scroll-body {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            padding-bottom: 50px;
            -webkit-overflow-scrolling: touch;
        }

        .category-heading {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            color: #71717a;
            letter-spacing: 1px;
            margin-bottom: 12px;
            border-bottom: 1px solid #1e1e24;
            padding-bottom: 4px;
        }

        .channel-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 25px;
        }

        /* Channel Block wrapper keeping button and source selection nested */
        .channel-card {
            background-color: #161622;
            border: 1px solid #27273a;
            border-radius: 10px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .action-btn {
            background-color: #252538;
            color: #ffffff;
            border: 1px solid #3d3d5c;
            padding: 14px 6px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
        }

        .action-btn:active {
            background-color: #3b82f6;
        }

        .source-selector {
            background-color: #0d0d14;
            color: #a1a1aa;
            border: 1px solid #27273a;
            padding: 6px;
            font-size: 11px;
            border-radius: 4px;
            width: 100%;
            outline: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- VISUAL HUB MONITOR PANEL -->
    <div class="video-viewport-stage">
        <video id="native-engine-display" controls autoplay playsinline></video>
        <iframe id="youtube-engine-display" allowfullscreen allow="autoplay; encrypted-media"></iframe>
    </div>

    <!-- TOUCH INTERFACE ROW -->
    <div class="main-scroll-body">
        
        <div class="category-heading">📺 Multi-Source Channel Matrix</div>
        <div class="channel-grid">

            <!-- SGPC DEVOTIONAL MATRIX -->
            <div class="channel-card">
                <button class="action-btn" onclick="tuneMatrixChannel('sgpc')">✨ SGPC Live</button>
                <select id="src-sgpc" class="source-selector">
                    <option value="yt:Qv2eRRU_56A">YouTube Source 1</option>
                    <option value="yt:vFXADUnLJ89FMc7y">YouTube Source 2</option>
                </select>
            </div>

            <!-- PTC MEDIA CONTAINER -->
            <div class="channel-card">
                <button class="action-btn" onclick="tuneMatrixChannel('ptc')">🎵 PTC Punjabi</button>
                <select id="src-ptc" class="source-selector">
                    <option value="yt:b2_x60nNf7o">YouTube Feed</option>
                </select>
            </div>

            <!-- GLOBAL DIRECT IPTV (STABLE DEMO CHANNELS) -->
            <div class="channel-card">
                <button class="action-btn" onclick="tuneMatrixChannel('nasatv')">🚀 NASA TV</button>
                <select id="src-nasatv" class="source-selector">
                    <option value="m3u:https://akamaized.net">Direct CDN Link</option>
                </select>
            </div>

            <div class="channel-card">
                <button class="action-btn" onclick="tuneMatrixChannel('nhk')">🇯🇵 NHK World</button>
                <select id="src-nhk" class="source-selector">
                    <option value="m3u:https://akamaized.net">Direct CDN Link</option>
                </select>
            </div>

            <div class="channel-card">
                <button class="action-btn" onclick="tuneMatrixChannel('redbull')">🏎️ Red Bull TV</button>
                <select id="src-redbull" class="source-selector">
                    <option value="m3u:https://amagi.tv">IPTV Database Link</option>
                </select>
            </div>

        </div>

    </div>

    <!-- LOGIC PROCESSING SCRIPT ENGINE -->
    <script>
        const cdnVideo = document.getElementById('native-engine-display');
        const ytIframe = document.getElementById('youtube-engine-display');
        let activeHlsLinkInstance = null;

        function clearViewports() {
            if (activeHlsLinkInstance) {
                activeHlsLinkInstance.destroy();
                activeHlsLinkInstance = null;
            }
            cdnVideo.style.display = 'none';
            cdnVideo.pause();
            cdnVideo.src = '';
            
            ytIframe.style.display = 'none';
            ytIframe.src = '';
        }

        function tuneMatrixChannel(channelKey) {
            clearViewports();
            
            const dropdownElement = document.getElementById('src-' + channelKey);
            const chosenValue = dropdownElement.value;

            // Type 1: YouTube Streaming Path Redirect
            if (chosenValue.startsWith('yt:')) {
                const videoId = chosenValue.substring(3); 
                ytIframe.style.display = 'block';
                ytIframe.src = "https://youtube.com" + videoId + "?autoplay=1&rel=0";
            } 
            // Type 2: Core HLS .m3u8 Stream Decoder
            else if (chosenValue.startsWith('m3u:')) {
                const streamUrl = chosenValue.substring(4); 
                cdnVideo.style.display = 'block';

                if (Hls.isSupported()) {
                    activeHlsLinkInstance = new Hls();
                    activeHlsLinkInstance.loadSource(streamUrl);
                    activeHlsLinkInstance.attachMedia(cdnVideo);
                    activeHlsLinkInstance.on(Hls.Events.MANIFEST_PARSED, function() {
                        cdnVideo.play().catch(err => console.log("System initialization block bypassed."));
                    });
                } else if (cdnVideo.canPlayType('application/x-mpegURL')) {
                    cdnVideo.src = streamUrl;
                    cdnVideo.play();
                }
            }
        }

        // Auto-run first option on launch to test the layout immediately
        tuneMatrixChannel('sgpc');
    </script>
</body>
</html>
