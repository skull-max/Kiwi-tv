<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV Control Board</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #12121c;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 700px;
        }
        .player-frame-box {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio Boundary */
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.5);
            border: 1px solid #222232;
        }
        .player-frame-box iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        .control-panel {
            background-color: #1a1a26;
            border-radius: 10px;
            padding: 20px;
            border: 1px solid #2a2a3a;
            text-align: center;
        }
        h2 {
            margin-top: 0;
            font-size: 20px;
            color: #ff9f43;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 15px;
        }
        .stream-btn {
            background: #252538;
            border: 1px solid #3b3b54;
            color: #fff;
            padding: 15px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background 0.2s, border-color 0.2s;
        }
        .stream-btn:active {
            background: #ff9f43;
            color: #000;
            border-color: #ff9f43;
        }
        .badge {
            font-size: 11px;
            background: #34495e;
            padding: 3px 8px;
            border-radius: 4px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- PERSISTENT TARGET FRAME CANVAS -->
    <div class="player-frame-box">
        <iframe id="targetFrame" src="player.html" allow="autoplay; fullscreen"></iframe>
    </div>

    <!-- STREAM CODING MANAGEMENT DASHBOARD -->
    <div class="control-panel">
        <h2>🪔 SGPC Amritsar Live Directory</h2>
        <p style="color:#8a8a9e; font-size:14px; margin:0;">Select your preferred underlying engine option to patch the live stream feed straight to your frame:</p>
        
        <div class="btn-group">
            <!-- Option 1: YouTube Live Stream Embedded Path -->
            <button class="stream-btn" onclick="sendMedia('youtube', 'https://youtube.com')">
                <span>Option 1: Play Stream via YouTube Live Engine</span>
                <span class="badge" style="background:#e74c3c;">YT Portal</span>
            </button>
            
            <!-- Option 2: IPTV Playlist URL (Direct streaming codec link extracted from standard playlists) -->
            <button class="stream-btn" onclick="sendMedia('iptv', 'https://akamaized.net')">
                <span>Option 2: Play Stream via IPTV Playlist Codec</span>
                <span class="badge" style="background:#2ecc71;">M3U8 Direct</span>
            </button>
        </div>
    </div>
</div>

<script>
    function sendMedia(mediaType, url) {
        const frameWindow = document.getElementById('targetFrame').contentWindow;
        
        // Safely shoot structural data commands directly across the frame barrier
        frameWindow.postMessage({
            type: "PLAY_STREAM",
            mediaType: mediaType,
            url: url
        }, "*");
    }
</script>

</body>
</html>
