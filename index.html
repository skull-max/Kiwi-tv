<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ultimate Media Terminal</title>
    
    <script src="https://jsdelivr.net"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: #0b0b0d;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* THE PLAYER BOX CONTAINER */
        .display-stage {
            flex: 1;
            width: 100%;
            background-color: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        video, iframe {
            width: 100%;
            height: 100%;
            aspect-ratio: 16/9;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
            display: none;
        }

        /* LOCKED BOTTOM NAVIGATION CONTROLS */
        .control-dock {
            background-color: #141419;
            border-top: 1px solid #252530;
            padding: 15px 10px 25px 10px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.8);
        }

        .dock-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .row-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            color: #6a6a7f;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .dock-btn {
            background-color: #1f1f26;
            color: #ffffff;
            border: 1px solid #2e2e3d;
            padding: 15px 5px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.1s;
        }

        .btn-live { border-left: 3px solid #ff9900; }
        .btn-iptv { border-left: 3px solid #4a90e2; }
        .btn-web  { border-left: 3px solid #2ecc71; }

        .dock-btn:active {
            transform: scale(0.95);
            background-color: #2e2e3d;
        }
    </style>
</head>
<body>

    <!-- SCREEN ZONE -->
    <div class="display-stage">
        <video id="native-player" controls autoplay playsinline></video>
        <!-- This iframe will now load the unblocked video IDs directly -->
        <iframe id="youtube-player" allowfullscreen allow="autoplay"></iframe>
        <iframe id="web-player" allowfullscreen></iframe>
    </div>

    <!-- TOUCH CONTROLS ACCESSIBLE AT THE BOTTOM -->
    <div class="control-dock">
        
        <div>
            <div class="row-label">Unblocked Live TV (Direct Video IDs)</div>
            <div class="dock-row">
                <!-- Using your verified SGPC video ID -->
                <button class="dock-btn btn-live" onclick="playYouTube('Qv2eRRU_56A')">✨ SGPC Live</button>
                <!-- Using a direct, working PTC Punjabi video ID -->
                <button class="dock-btn btn-live" onclick="playYouTube('b2_x60nNf7o')">🎵 PTC Punjabi</button>
                <button class="dock-btn btn-live" onclick="playYouTube('9Auqeyv765k')">🌍 Sky News</button>
            </div>
        </div>

        <div>
            <div class="row-label">Direct Global IPTV (.m3u8)</div>
            <div class="dock-row">
                <button class="dock-btn btn-iptv" onclick="playRawM3U8('https://akamaized.net')">🚀 NASA TV</button>
                <button class="dock-btn btn-iptv" onclick="playRawM3U8('https://akamaized.net')">🇯🇵 NHK World</button>
                <button class="dock-btn btn-iptv" onclick="playRawM3U8('https://amagi.tv')">🏎️ Red Bull TV</button>
            </div>
        </div>

        <div>
            <div class="row-label">External Portals</div>
            <div class="dock-row">
                <button class="dock-btn btn-web" onclick="playWebView('https://vidbox.vc')">🌐 VidBox Portal</button>
                <button class="dock-btn btn-web" onclick="triggerAndroidApp('nz.co.dishtv.FreeviewLiveTV')">📺 Freeview APK</button>
                <button class="dock-btn btn-web" onclick="triggerAndroidApp('com.google.android.youtube')">🔴 YouTube App</button>
            </div>
        </div>

    </div>

    <script>
        const videoScreen = document.getElementById('native-player');
        const ytScreen = document.getElementById('youtube-player');
        const webScreen = document.getElementById('web-player');

        function resetScreens() {
            videoScreen.style.display = 'none';
            videoScreen.pause();
            ytScreen.style.display = 'none';
            ytScreen.src = '';
            webScreen.style.display = 'none';
            webScreen.src = '';
        }

        // RE-ENGINEERED: We now inject the clean /embed/VIDEO_ID string
        function playYouTube(videoId) {
            resetScreens();
            ytScreen.style.display = 'block';
            ytScreen.src = "https://youtube.com" + videoId + "?autoplay=1";
        }

        function playRawM3U8(streamUrl) {
            resetScreens();
            videoScreen.style.display = 'block';
            if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(streamUrl);
                hls.attachMedia(videoScreen);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    videoScreen.play();
                });
            } else if (videoScreen.canPlayType('application/x-mpegURL')) {
                videoScreen.src = streamUrl;
                videoScreen.play();
            }
        }

        function playWebView(targetUrl) {
            resetScreens();
            webScreen.style.display = 'block';
            webScreen.src = targetUrl;
        }

        function triggerAndroidApp(packageName) {
            window.open("intent://#Intent;scheme=android-app;package=" + packageName + ";end", '_blank');
        }
        
        // Auto-boot onto SGPC Live when the web app opens!
        playYouTube('Qv2eRRU_56A');
    </script>
</body>
</html>
