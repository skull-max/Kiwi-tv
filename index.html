<!DOCTYPE html>
<html lang="en-NZ">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiwi Freeview Hub</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            margin-bottom: 20px;
            font-size: 24px;
        }
        /* The Video Container Box */
        .video-box {
            width: 100%;
            max-width: 800px;
            margin-bottom: 25px;
            border-radius: 12px;
            overflow: hidden;
            background-color: #000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }
        iframe {
            width: 100%;
            aspect-ratio: 16/9;
            border: none;
        }
        .grid-layout {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 12px;
            width: 100%;
            max-width: 800px;
        }
        .btn-channel {
            background-color: #242424;
            color: white;
            border: 2px solid #3a3a3a;
            padding: 20px 10px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.1s;
        }
        .btn-channel:active {
            background-color: #0084ff;
            border-color: #ffffff;
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <h1>🇳🇿 Kiwi Freeview Hub</h1>

    <!-- 
      Instead of using a raw video tag which mobile browsers block, 
      we use an 'iframe' windows container. This acts as an embedded 
      mini-browser that loads the video streams completely naturally.
    -->
    <div class="video-box">
        <iframe id="tv-screen" src="https://threenow.co.nz" allowfullscreen allow="autoplay"></iframe>
    </div>

    <div class="grid-layout">
        <!-- We use touch-friendly web streaming layouts optimized for browser windows -->
        <button class="btn-channel" onclick="tuneChannel('https://tvnz.co.nz')">TVNZ 1</button>
        <button class="btn-channel" onclick="tuneChannel('https://tvnz.co.nz')">TVNZ 2</button>
        <button class="btn-channel" onclick="tuneChannel('https://tvnz.co.nz')">Duke</button>
        <button class="btn-channel" onclick="tuneChannel('https://threenow.co.nz')">Three</button>
        <button class="btn-channel" onclick="tuneChannel('https://threenow.co.nz')">Bravo</button>
        <button class="btn-channel" onclick="tuneChannel('https://threenow.co.nz')">Eden</button>
    </div>

    <script>
        // Simple JavaScript controller to swap the iframe target source
        function tuneChannel(webUrl) {
            document.getElementById('tv-screen').src = webUrl;
        }
    </script>
</body>
</html>
