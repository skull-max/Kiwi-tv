<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punjabi Live TV Hub</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            margin-top: 10px;
            margin-bottom: 5px;
            font-size: 24px;
        }
        p {
            color: #888888;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .video-box {
            width: 100%;
            max-width: 800px;
            margin-bottom: 25px;
            border-radius: 12px;
            overflow: hidden;
            background-color: #000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }
        iframe {
            width: 100%;
            aspect-ratio: 16/9;
            border: none;
        }
        .grid-layout {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            width: 100%;
            max-width: 800px;
        }
        .btn-channel {
            background-color: #1e1e1e;
            color: white;
            border: 2px solid #333333;
            padding: 22px 10px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.1s ease;
        }
        /* Devotional button accent color styling */
        .btn-devotional {
            background-color: #3d2a04;
            border-color: #ff9900;
        }
        .btn-channel:active {
            background-color: #ff0000;
            border-color: #ffffff;
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <h1>📺 Punjabi Live TV Hub</h1>
    <p>Tap a channel layout below to tune the live feed player automatically.</p>

    <div class="video-box">
        <!-- Defaulting to SGPC Live Amritsar on launch screen -->
        <iframe id="youtube-screen" src="https://youtube.com" allowfullscreen allow="autoplay"></iframe>
    </div>

    <div class="grid-layout">
        <!-- JavaScript functions parse the active channel IDs when pressed -->
        <button class="btn-channel btn-devotional" onclick="tuneYouTube('UCLXp8k_A3_kS08v_MvUo_pQ')">SGPC Live ✨</button>
        <button class="btn-channel" onclick="tuneYouTube('UCHJW1_0oPzYZl89wX_jhrgA')">PTC Punjabi 🎵</button>
        <button class="btn-channel" onclick="tuneYouTube('UCYF_LfBBxkFBEgaSCNrqW3w')">Zee Punjabi 🎭</button>
    </div>

    <script>
        // Controller function updates the frame viewport source smoothly 
        function tuneYouTube(channelId) {
            var newEmbedUrl = "https://youtube.com" + channelId + "&autoplay=1";
            document.getElementById('youtube-screen').src = newEmbedUrl;
        }
    </script>
</body>
</html>
