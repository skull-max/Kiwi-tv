<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Free TV Player</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* 1. FIXED TOP SCREEN: Keeps the player stuck to the top */
        .video-container {
            width: 100%;
            aspect-ratio: 16/9;
            background-color: #000000;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* 2. SCROLLABLE BUTTONS LIST: Scrolls smoothly underneath on phone or tablet */
        .buttons-list {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            padding-bottom: 50px; /* Space at bottom so it doesn't clip */
        }

        .section-title {
            font-size: 12px;
            color: #888888;
            margin-bottom: 10px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* 2 Buttons per row on phone */
            gap: 10px;
            margin-bottom: 25px;
        }

        .btn {
            background-color: #222222;
            color: #ffffff;
            border: 1px solid #333333;
            padding: 20px 10px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
        }

        .btn:active {
            background-color: #ff0000; /* Turns red when tapped */
        }
    </style>
</head>
<body>

    <!-- VIDEO STAGE LOCKED AT TOP -->
    <div class="video-container">
        <!-- Starts automatically playing the SGPC Live channel stream -->
        <iframe id="tv-screen" src="https://youtube.com" allowfullscreen allow="autoplay"></iframe>
    </div>

    <!-- BUTTONS SCROLL UNDERNEATH -->
    <div class="buttons-list">

        <div class="section-title">Popular Free Channels</div>
        <div class="grid">
            <!-- These use the lightweight Channel IDs to fetch whatever is live right now -->
            <button class="btn" onclick="changeChannel('UCLXp8k_A3_kS08v_MvUo_pQ')">✨ SGPC Live</button>
            <button class="btn" onclick="changeChannel('UCHJW1_0oPzYZl89wX_jhrgA')">🎵 PTC Punjabi</button>
            <button class="btn" onclick="changeChannel('UCqhnX4jA0A5paNd1v-zEysw')">🇬🇧 Sky News</button>
            <button class="btn" onclick="changeChannel('UC8p1vwvWtl6T73JiExfUx1g')">🌍 Al Jazeera</button>
            <button class="btn" onclick="changeChannel('UC9s9Z3A15Nf5M_8V6Xw')">🇩🇪 DW News</button>
            <button class="btn" onclick="changeChannel('UCX6BOlQ2HFxs36v_sYfHwTw')">🇮🇳 Aaj Tak</button>
        </div>

        <div class="section-title">New Zealand Freeview Links</div>
        <div class="grid">
            <!-- Launches your tablet's local apps directly to watch NZ TV without blocks -->
            <button class="btn" onclick="openApp('nz.co.dishtv.FreeviewLiveTV')">📺 Freeview App</button>
            <button class="btn" onclick="openApp('com.google.android.youtube')">🔴 YouTube App</button>
        </div>

    </div>

    <script>
        // Simply tells the iframe to drop the old stream and load the new one instantly
        function changeChannel(channelId) {
            document.getElementById('tv-screen').src = "https://youtube.com" + channelId + "&autoplay=1";
        }

        // Bypasses the website completely to open your tablet's apps
        function openApp(packageName) {
            window.open("intent://#Intent;scheme=android-app;package=" + packageName + ";end", '_blank');
        }
    </script>

</body>
</html>
