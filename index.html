<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Master India IPTV Terminal</title>
    
    <!-- Programmatic HLS stream unpacker engine -->
    <script src="https://jsdelivr.net"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: #09090b;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* SCREEN PLAYBACK PORT */
        .display-stage {
            flex: 1;
            width: 100%;
            background-color: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        video, iframe {
            width: 100%;
            height: 100%;
            aspect-ratio: 16/9;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
            display: none;
        }

        /* CONTROLS ZONE AT THE BOTTOM */
        .control-dock {
            background-color: #121216;
            border-top: 1px solid #272730;
            padding: 15px 10px 25px 10px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.8);
        }

        .row-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            color: #71717a;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .dock-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .dock-btn {
            background-color: #1e1e24;
            color: #ffffff;
            border: 1px solid #2d2d38;
            padding: 16px 5px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.1s ease;
        }

        /* Accent indicators for your video sources */
        .btn-cdn { border-left: 3px solid #3b82f6; }
        .btn-yt { border-left: 3px solid #ef4444; }

        .dock-btn:active {
            transform: scale(0.95);
            background-color: #272732;
        }

        /* INTERACTIVE MANUAL TESTING BAR */
        .tester-bar {
            display: flex;
            gap: 8px;
            width: 100%;
        }
        .tester-input {
            flex: 1;
            background-color: #18181b;
            border: 1px solid #272730;
            padding: 10px;
            color: #ffffff;
            border-radius: 6px;
            font-size: 13px;
        }
        .tester-btn {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 10px 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- VIDEO VIEWPORT AREA -->
    <div class="display-stage">
        <video id="native-player" controls autoplay playsinline></video>
        <iframe id="youtube-player" allowfullscreen allow="autoplay"></iframe>
    </div>

    <!-- LOWER SYSTEM CONTROL CONSOLE -->
    <div class="control-dock">
        
        <!-- SECTION 1: CDN RAW STREAMS FROM M3U8 -->
        <div>
            <div class="row-label">GitHub Playlist Raw CDN Feeds</div>
            <div class="dock-row">
                <button class="dock-btn btn-cdn" onclick="playRawM3U8('https://akamaized.net')">🇮🇳 NDTV India</button>
                <button class="dock-btn btn-cdn" onclick="playRawM3U8('https://cloudfront.net')">📰 ABP News</button>
                <button class="dock-btn btn-cdn" onclick="playRawM3U8('https://cloudfront.net')">⚡ ABP Ananda</button>
            </div>
        </div>

        <!-- SECTION 2: LIVE YOUTUBE VIDEO TARGETS -->
        <div>
            <div class="row-label">YouTube Live Channels (Video IDs)</div>
            <div class="dock-row">
                <button class="dock-btn btn-yt" onclick="playYouTube('Qv2eRRU_56A')">✨ SGPC Live</button>
                <button class="dock-btn btn-yt" onclick="playYouTube('sYZtOFzM78M')">🌏 India Today</button>
                <button class="dock-btn btn-yt" onclick="playYouTube('Nq2wYlWFucg')">🔥 Aaj Tak</button>
            </div>
        </div>

        <!-- SECTION 3: EXPERIMENTAL MANUAL TESTING PORT -->
        <div>
            <div class="row-label">Live Link Code Testing Port</div>
            <div class="tester-bar">
                <input type="text" id="custom-url-field" class="tester-input" placeholder="Paste any raw .m3u8 link or YouTube Video ID here...">
                <button class="tester-btn" onclick="testCustomInput()">Run</button>
            </div>
        </div>

    </div>

    <script>
        const videoScreen = document.getElementById('native-player');
        const ytScreen = document.getElementById('youtube-player');
        let currentHlsInstance = null;

        function clearScreens() {
            // Safely detach any old video streams running in the background memory
            if (currentHlsInstance) {
                currentHlsInstance.destroy();
                currentHlsInstance = null;
            }
            videoScreen.style.display = 'none';
            videoScreen.pause();
            videoScreen.src = '';
            
            ytScreen.style.display = 'none';
            ytScreen.src = '';
        }

        // Handler Module 1: Decodes Direct CDN Streams (.m3u8 links)
        function playRawM3U8(streamUrl) {
            clearScreens();
            videoScreen.style.display = 'block';

            if (Hls.isSupported()) {
                currentHlsInstance = new Hls();
                currentHlsInstance.loadSource(streamUrl);
                currentHlsInstance.attachMedia(videoScreen);
                currentHlsInstance.on(Hls.Events.MANIFEST_PARSED, function() {
                    videoScreen.play().catch(e => console.log("Autoplay context blocker tripped: ", e));
                });
            } else if (videoScreen.canPlayType('application/x-mpegURL')) {
                videoScreen.src = streamUrl;
                videoScreen.play();
            }
        }

        // Handler Module 2: Loads Unblocked Embed Video IDs
        function playYouTube(videoId) {
            clearScreens();
            ytScreen.style.display = 'block';
            ytScreen.src = "https://youtube.com" + videoId + "?autoplay=1&rel=0";
        }

        // Developer Tool Logic: Analyzes what link type you paste and funnels it to the correct engine
        function testCustomInput() {
            const inputData = document.getElementById('custom-url-field').value.trim();
            if (!inputData) return;

            if (inputData.includes('.m3u8')) {
                playRawM3U8(inputData);
            } else {
                // If it doesn't look like a direct file link, assume it is a raw YouTube Video ID sequence
                playYouTube(inputData);
            }
        }

        // Automatically fire up NDTV India stream on initial application launch
        playRawM3U8('https://akamaized.net');
    </script>
</body>
</html>
