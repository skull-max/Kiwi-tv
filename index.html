<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Live TV Portal</title>
    <!-- Include the video engine library directly in this file to prevent loading lag -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body {
            font-family: sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            text-align: center;
        }
        .wrapper {
            max-width: 700px;
            margin: 0 auto;
        }
        .video-box {
            width: 100%;
            background: #000;
            border-radius: 8px;
            margin-bottom: 15px;
            aspect-ratio: 16/9;
        }
        video {
            width: 100%;
            height: 100%;
            border-radius: 8px;
        }
        select {
            width: 100%;
            padding: 12px;
            background: #222;
            color: #fff;
            border: 1px solid #444;
            border-radius: 6px;
            font-size: 16px;
            margin-bottom: 15px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 10px;
        }
        .card {
            background: #1e1e1e;
            padding: 15px 5px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            border: 1px solid #333;
        }
        .card:active {
            background: #00adb5;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="wrapper">
    <!-- Clean Local Video Engine Player Element -->
    <div id="playerContainer" class="video-box">
        <video id="videoPlayer" controls autoplay playsinline></video>
    </div>

    <!-- Dropdown Selector -->
    <select id="menu" onchange="switchCategory()">
        <option value="all">🌐 View All Channels</option>
        <option value="nz">🇳🇿 New Zealand Channels</option>
        <option value="india">🇮🇳 India Channels</option>
    </select>

    <!-- Channel Cards Grid -->
    <div id="channelGrid" class="grid">
        <!-- SGPC Live Stream -->
        <div class="card" data-cat="india" onclick="playYouTube('https://youtube.com')">🪔 SGPC Amritsar Live</div>
        
        <!-- Live NZ TV stream points (Direct m3u8 codecs from Matt Huisman public index) -->
        <div class="card" data-cat="nz" onclick="playM3U8('https://cloudfront.net')">🇳🇿 TVNZ 1</div>
        <div class="card" data-cat="nz" onclick="playM3U8('https://duoak7vltfob0.cloudfront.net/v1/master/b1f4432f8f95be9e629d97baabfed15b8cacd1f8/TVNZ_2/master.m3u8')">🇳🇿 TVNZ 2</div>
        
        <!-- Verified Indian Public Streams -->
        <div class="card" data-cat="india" onclick="playM3U8('https://akamaized.net')">🇮🇳 DD News Live</div>
    </div>
</div>

<script>
    const video = document.getElementById('videoPlayer');
    const hls = new Hls();

    function playM3U8(url) {
        // If switching from YouTube, ensure player interface defaults are restored
        document.getElementById('playerContainer').innerHTML = '<video id="videoPlayer" controls autoplay playsinline></video>';
        const newVideo = document.getElementById('videoPlayer');
        
        if (Hls.isSupported()) {
            hls.loadSource(url);
            hls.attachMedia(newVideo);
        } else if (newVideo.canPlayType('application/vnd.apple.mpegurl')) {
            newVideo.src = url;
        }
    }

    function playYouTube(embedUrl) {
        // Swap out the video engine block natively to prevent the "Sad Face" frame crash
        document.getElementById('playerContainer').innerHTML = 
            `<iframe width="100%" height="100%" src="${embedUrl}" frameborder="0" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen style="border-radius:8px;"></iframe>`;
    }

    function switchCategory() {
        const selected = document.getElementById('menu').value;
        const cards = document.querySelectorAll('.card');
        
        cards.forEach(card => {
            if (selected === 'all' || card.getAttribute('data-cat') === selected) {
                card.classList.remove('hidden');
            } else {
                card.classList.add('hidden');
            }
        });
    }
</script>

</body>
</html>
