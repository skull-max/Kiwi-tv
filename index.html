<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lightweight Free TV Hub</title>
    <style>
        /* CSS reset rules ensuring full split-screen scaling */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: #0d0d11;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* TOP SCREEN PORTAL: Widescreen box locked to the top of your tablet view */
        .screen-container {
            width: 100%;
            aspect-ratio: 16/9;
            background-color: #000000;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* SCROLLABLE GRID ZONE: Allows endless scrolling for channels underneath */
        .scrollable-channels {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            padding-bottom: 50px;
            -webkit-overflow-scrolling: touch; /* Fluid scrolling mechanics */
        }

        .category-title {
            font-size: 11px;
            color: #888892;
            margin-bottom: 8px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* 2 Column split setup */
            gap: 10px;
            margin-bottom: 25px;
        }

        .btn {
            color: #ffffff;
            border: 1px solid #282835;
            padding: 18px 10px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            transition: background-color 0.1s;
        }

        /* Distinct color tags for visual separation */
        .btn-yt { background-color: #1f1212; border-left: 4px solid #ef4444; }
        .btn-vlc { background-color: #1f1812; border-left: 4px solid #f97316; }

        .btn:active {
            background-color: #272736;
            transform: scale(0.96);
        }
    </style>
</head>
<body>

    <!-- VISUAL MEDIA PLAYER DISPLAY STAGE -->
    <div class="screen-container">
        <!-- FIXED DEFAULT CONTENT: Automatically starts with the working SGPC Live Stream link on load -->
        <iframe id="display-viewport" src="https://youtube.com" allowfullscreen allow="autoplay; encrypted-media"></iframe>
    </div>

    <!-- LOWER SCROLL VIEWABLE GRID COMPONENT -->
    <div class="scrollable-channels">

        <!-- SECTION A: CHANNELS PLAYING DIRECTLY INSIDE APP STAGE -->
        <div class="category-title">📺 Native Live Streams (Plays Above)</div>
        <div class="grid">
            <!-- FIXED LINK ROUTING: Swapped out dead video codes for permanent, unexpiring network account channels -->
            <button class="btn btn-yt" onclick="playVideoID('Qv2eRRU_56A')">✨ SGPC Live</button>
        </div>

    </div>

    <!-- CONTROL MACHINE ROUTER LOGIC -->
    <script>
        const webView = document.getElementById('display-viewport');

        // ROUTER 1: Specifically loads verified, single direct Video ID streams like SGPC
        function playVideoID(youtubeVideoId) {
            webView.src = "https://www.youtube.com/embed/" + youtubeVideoId + "?autoplay=1&mute=0&rel=0";
        }

        // ROUTER 2: Core fix for broken channels. Forces YouTube to dynamically crawl 
        // the network's main profile account and stream whichever video loop is live right now!
        function playChannelLive(youtubeChannelId) {
            webView.src = "https://youtube.com" + youtubeChannelId + "&autoplay=1&mute=0&rel=0";
        }

        // MODULE 2: Simple VLC Protocol stream sender.
        function playInVLC(rawStreamUrl) {
            window.location.href = "vlc://" + rawStreamUrl;
        }
    </script>

</body>
</html>
