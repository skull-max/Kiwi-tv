<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NZ Free TV Controller</title>
    <style>
        body {
            margin: 0;
            padding: 15px;
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }
        h2 { font-size: 20px; margin-bottom: 5px; color: #007aff; }
        p { color: #8e8e93; font-size: 14px; margin-top: 0; margin-bottom: 15px; }
        
        /* The player frame layout sizing */
        .player-frame-wrapper {
            width: 100%;
            max-width: 800px;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            margin-bottom: 20px;
            border: 1px solid #2c2c2e;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Channel grid selection cards */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px;
            max-width: 800px;
        }
        .card {
            background: #1c1c1e;
            border: 1px solid #2c2c2e;
            padding: 15px 10px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: transform 0.2s, background 0.2s;
        }
        .card:hover {
            background: #2c2c2e;
            transform: translateY(-2px);
            border-color: #007aff;
        }
        .card.active {
            background: #007aff;
            color: #fff;
            border-color: #0a84ff;
        }
    </style>
</head>
<body>

    <h2>NZ Free TV Controller</h2>
    <p>Tap a channel card below to load the live broadcast inside the standalone frame frame.</p>

    <!-- Isolated Player Frame -->
    <div class="player-frame-wrapper">
        <iframe id="playerFrame" src="player.html" allow="autoplay; fullscreen"></iframe>
    </div>

    <!-- Modifiable Station List -->
    <div class="grid">
        <div class="card" onclick="changeChannel(this, 'https://play.itv.com/live/itv1', 'TVNZ 1 Alternative')">TVNZ 1</div>
        <div class="card" onclick="changeChannel(this, 'https://bpa-live.example.com/stream2/index.m3u8', 'TVNZ 2 Demo')">TVNZ 2</div>
        <div class="card" onclick="changeChannel(this, 'https://bpa-live.example.com/stream3/index.m3u8', 'Three Live')">Three Now</div>
        <div class="card" onclick="changeChannel(this, 'https://bpa-live.example.com/stream4/index.m3u8', 'Whakaata Māori')">Māori TV</div>
        <div class="card" onclick="changeChannel(this, 'https://bpa-live.example.com/stream5/index.m3u8', 'Rush Music')">Rush</div>
    </div>

    <script>
        function changeChannel(element, streamUrl, channelName) {
            // Update Active UI State
            document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
            element.classList.add('active');

            // Send URL and Details directly to the embedded player
            const iframe = document.getElementById('playerFrame');
            if (iframe.contentWindow) {
                // Method 1: Direct function execution across same origin
                try {
                    iframe.contentWindow.loadStream(streamUrl, channelName);
                } catch(e) {
                    // Method 2: Safe postMessage fallback for absolute isolation cross-origin
                    iframe.contentWindow.postMessage({
                        type: "LOAD_STREAM",
                        url: streamUrl,
                        name: channelName
                    }, "*");
                }
            }
        }

        // Auto-load first channel on index layout ready
        window.addEventListener('load', () => {
            const firstCard = document.querySelector('.card');
            if(firstCard) firstCard.click();
        });
    </script>
</body>
</html>
