<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Universal Multi-Source Terminal</title>
    
    <!-- Programmatic HLS stream unpacker engine used to parse raw .m3u8 feeds inside your sandbox layout -->
    <script src="https://jsdelivr.net"></script>

    <style>
        /* CSS reset rules ensuring full split-screen scaling without clipping elements */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: #0d0d11;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* TOP SCREEN PORTAL: Widescreen box locked to the top of your tablet view */
        .screen-container {
            width: 100%;
            aspect-ratio: 16/9;
            background-color: #000000;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }

        video, iframe {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
            display: none;
        }

        /* SCROLLABLE GRID ZONE: Allows endless scrolling for channels underneath */
        .scrollable-channels {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            padding-bottom: 50px;
            -webkit-overflow-scrolling: touch; /* Fluid touch response on mobile viewports */
        }

        .category-title {
            font-size: 11px;
            color: #888892;
            margin-top: 15px;
            margin-bottom: 8px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #22222b;
            padding-bottom: 4px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* 2 Column split layout */
            gap: 12px;
            margin-bottom: 15px;
        }

        /* Modular Channel Card Layout */
        .channel-card {
            background-color: #171722;
            border: 1px solid #29293a;
            border-radius: 12px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .btn-play {
            background-color: #252538;
            color: #ffffff;
            border: 1px solid #3d3d5c;
            padding: 15px 5px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            transition: background-color 0.1s;
        }

        .btn-play:active {
            background-color: #3b82f6; /* Flashes blue upon active finger gesture execution */
        }

        /* Dropdown component design mappings */
        .source-selector {
            background-color: #0d0d14;
            color: #a1a1aa;
            border: 1px solid #29293a;
            padding: 8px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 6px;
            width: 100%;
            outline: none;
            cursor: pointer;
        }

        .source-selector:focus {
            border-color: #3b82f6;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <!-- VISUAL MEDIA PLAYER DISPLAY STAGE -->
    <div class="screen-container">
        <video id="native-engine-display" controls autoplay playsinline></video>
        <iframe id="youtube-engine-display" allowfullscreen allow="autoplay; encrypted-media"></iframe>
    </div>

    <!-- LOWER SCROLL VIEWABLE GRID COMPONENT -->
    <div class="scrollable-channels">

        <!-- CATEGORY 1: SPIRITUAL & DEVOTIONAL -->
        <div class="category-title">✨ Spiritual Broadcasting</div>
        <div class="grid">
            <div class="channel-card">
                <button class="btn-play" onclick="tuneMatrixChannel('sgpc')">SGPC Live</button>
                <select id="src-sgpc" class="source-selector">
                    <option value="yt_vid:Qv2eRRU_56A">Option 1: Direct Video ID Feed</option>
                    <option value="yt_ch:UCkA21M22vGK9GtAvq3DvSlA">Option 2: Permanent Account Stream</option>
                    <option value="m3u:https://mux.dev">Option 3: Mux Live Test Loop</option>
                    <option value="m3u:https://longtailvideo.com">Option 4: BipBop Test Loop</option>
                </select>
            </div>
        </div>

        <!-- CATEGORY 2: KIDS NETWORKS -->
        <div class="category-title">🧸 Kids Networks</div>
        <div class="grid">
            <div class="channel-card">
                <button class="btn-play" onclick="tuneMatrixChannel('spongebob')">SpongeBob Live</button>
                <select id="src-spongebob" class="source-selector">
                    <option value="yt_ch:UCx27Pkk8plpiosF14qXq-VA">Option 1: Official Account Stream</option>
                    <option value="yt_vid:3X7yV_mJLCY">Option 2: YouTube Marathon Link</option>
                    <option value="m3u:https://mux.dev">Option 3: Master Test Loop 1</option>
                    <option value="m3u:https://longtailvideo.com">Option 4: Master Test Loop 2</option>
                </select>
            </div>
            <div class="channel-card">
                <button class="btn-play" onclick="tuneMatrixChannel('nickelodeon')">Nickelodeon</button>
                <select id="src-nickelodeon" class="source-selector">
                    <option value="m3u:http://moveonjoy.com">Option 1: Public IPTV CDN Link</option>
                    <option value="m3u:https://netplus.ch">Option 2: Alternative Europe Node</option>
                    <option value="m3u:https://mux.dev">Option 3: Player Engine Test Loop</option>
                    <option value="yt_vid:Qv2eRRU_56A">Option 4: Devotional Content Backup</option>
                </select>
            </div>
        </div>

        <!-- CATEGORY 3: DOCUMENTARY CHANNELS -->
        <div class="category-title">🌿 Documentary Channels</div>
        <div class="grid">
            <div class="channel-card">
                <button class="btn-play" onclick="tuneMatrixChannel('discovery')">Discovery Channel</button>
                <select id="src-discovery" class="source-selector">
                    <option value="m3u:http://38.96.178">Option 1: Public Index Server Link</option>
                    <option value="m3u:https://ddns.vn">Option 2: Alternate HD Stream Node</option>
                    <option value="m3u:https://mux.dev">Option 3: Mux Live Test Loop</option>
                    <option value="m3u:https://longtailvideo.com">Option 4: BipBop Test Loop</option>
                </select>
            </div>
            <div class="channel-card">
                <button class="btn-play" onclick="tuneMatrixChannel('animalplanet')">Animal Planet</button>
                <select id="src-animalplanet" class="source-selector">
                    <option value="m3u:https://amagi.tv">Option 1: Public Amagi Broadcast</option>
                    <option value="m3u:https://mux.dev">Option 2: Master Test Loop 1</option>
                    <option value="m3u:https://longtailvideo.com">Option 3: Master Test Loop 2</option>
                    <option value="yt_vid:Qv2eRRU_56A">Option 4: Devotional Content Backup</option>
                </select>
            </div>
        </div>

        <!-- CATEGORY 4: POPULAR INDIAN NETWORKS -->
        <div class="category-title">🇮🇳 Popular Indian Channels</div>
        <div class="grid">
            <div class="channel-card">
                <button class="btn-play" onclick="tuneMatrixChannel('ptc')">PTC Punjabi</button>
                <select id="src-ptc" class="source-selector">
                    <option value="yt_ch:UCHJW1_0oPzYZl89wX_jhrgA">Option 1: Permanent Account Stream</option>
                    <option value="yt_vid:b2_x60nNf7o">Option 2: Direct Video ID Feed</option>
                    <option value="m3u:https://akamaized.net">Option 3: GitHub India CDN Link</option>
                    <option value="m3u:https://mux.dev">Option 4: Player Engine Test Loop</option>
                </select>
            </div>
            <div class="channel-card">
                <button class="btn-play" onclick="tuneMatrixChannel('aajtak')">Aaj Tak</button>
                <select id="src-aajtak" class="source-selector">
                    <option value="yt_vid:Nq2wYlWFucg">Option 1: Direct Video ID Feed</option>
                    <option value="yt_vid:sYZtOFzM78M">Option 2: India Today Feed Link</option>
                    <option value="yt_vid:e1FIApIafWE">Option 3: India TV Live Link</option>
                    <option value="yt_ch:UCX6BOlQ2HFxs36v_sYfHwTw">Option 4: Permanent Account Stream</option>
                </select>
            </div>
        </div>

        <!-- CATEGORY 5: NEW ZEALAND FREEVIEW -->
        </div> <!-- Closes the NZ channel grid div -->
    </div> <!-- Closes the scrollable-channels wrapper div -->

    <!-- CORE INTERNAL INTERFACE LOGIC ENGINE -->
    <script>
        const cdnVideo = document.getElementById('native-engine-display');
        const ytIframe = document.getElementById('youtube-engine-display');
        let activeHlsLinkInstance = null;

        // Clean out display resources completely to prevent player overlaps
        function resetActiveViewports() {
            if (activeHlsLinkInstance) {
                activeHlsLinkInstance.destroy();
                activeHlsLinkInstance = null;
            }
            cdnVideo.style.display = 'none';
            cdnVideo.pause();
            cdnVideo.src = '';
            
            ytIframe.style.display = 'none';
            ytIframe.src = '';
        }

        // Primary Evaluator: Reads drop-down selection parameters and routes them to the correct internal engine
        function tuneMatrixChannel(channelKey) {
            resetActiveViewports();
            
            // Reads whichever specific drop-down item is selected for the targeted channel card
            const dropdownElement = document.getElementById('src-' + channelKey);
            const chosenValue = dropdownElement.value;

            // Route 1: Explicitly saved direct YouTube Video ID
            if (chosenValue.startsWith('yt_vid:')) {
                const videoId = chosenValue.substring(7); // Drops the prefix "yt_vid:"
                ytIframe.style.display = 'block';
                ytIframe.src = "https://youtube.com" + videoId + "?autoplay=1&mute=0&rel=0";
            } 
            // Route 2: Permanent Unexpiring Channel Profile Stream Finder
            else if (chosenValue.startsWith('yt_ch:')) {
                const channelId = chosenValue.substring(6); // Drops the prefix "yt_ch:"
                ytIframe.style.display = 'block';
                ytIframe.src = "https://youtube.comlive_stream?channel=" + channelId + "&autoplay=1&mute=0&rel=0";
            }
            // Route 3: Core HLS .m3u8 Stream Decoder for CDN Nodes
            else if (chosenValue.startsWith('m3u:')) {
                const streamUrl = chosenValue.substring(4); // Drops the prefix "m3u:"
                cdnVideo.style.display = 'block';

                if (Hls.isSupported()) {
                    activeHlsLinkInstance = new Hls();
                    activeHlsLinkInstance.loadSource(streamUrl);
                    activeHlsLinkInstance.attachMedia(cdnVideo);
                    activeHlsLinkInstance.on(Hls.Events.MANIFEST_PARSED, function() {
                        cdnVideo.play().catch(err => console.log("Autoplay context blockade bypassed."));
                    });
                } else if (cdnVideo.canPlayType('application/x-mpegURL')) {
                    cdnVideo.src = streamUrl;
                    cdnVideo.play();
                }
            }
            // Route 4: Deep linking outward to local Android Applications
            else if (chosenValue.startsWith('app:')) {
                const packageIdentity = chosenValue.substring(4); // Drops the prefix "app:"
                window.open("intent://#Intent;scheme=android-app;package=" + packageIdentity + ";end", '_blank');
            }
            // Route 5: External Tab Breakouts for secure network targets (Core New Zealand Fix)
            else if (chosenValue.startsWith('web:')) {
                const targetUrl = chosenValue.substring(4); // Drops the prefix "web:"
                window.open(targetUrl, '_blank');
            }
        }

        // AUTO-LAUNCH BLOCK: Runs SGPC selection instantly upon initial page compilation
        tuneMatrixChannel('sgpc');
    </script>
</body>
</html>
