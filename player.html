<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embedded Frame Engine</title>
    <!-- Include the streaming compilation script directly in the frame -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        video, iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .hidden { display: none !important; }
        .placeholder {
            color: #55556b;
            font-family: sans-serif;
            font-size: 16px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="statusText" class="placeholder">Awaiting link configuration from dashboard...</div>
    <video id="videoEngine" controls autoplay playsinline class="hidden"></video>
    <div id="youtubeWrapper" class="hidden" style="width:100%; height:100%;"></div>

<script>
    const video = document.getElementById('videoEngine');
    const ytWrapper = document.getElementById('youtubeWrapper');
    const statusText = document.getElementById('statusText');
    let hlsEngine = null;

    function clearFrame() {
        if (hlsEngine) {
            hlsEngine.destroy();
            hlsEngine = null;
        }
        video.src = "";
        video.classList.add('hidden');
        ytWrapper.innerHTML = "";
        ytWrapper.classList.add('hidden');
        statusText.classList.add('hidden');
    }

    // Communication bridge listener
    window.addEventListener("message", function(event) {
        const command = event.data;
        if (command.type === "PLAY_STREAM") {
            clearFrame();
            
            if (command.mediaType === "youtube") {
                // Option 1 Path: Clear elements and generate a targeted video viewport
                ytWrapper.classList.remove('hidden');
                ytWrapper.innerHTML = `<iframe src="${command.url}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
            } 
            else if (command.mediaType === "iptv") {
                // Option 2 Path: Mount the live m3u8 decoder pipeline
                video.classList.remove('hidden');
                if (Hls.isSupported()) {
                    hlsEngine = new Hls({ maxMaxBufferLength: 10 });
                    hlsEngine.loadSource(command.url);
                    hlsEngine.attachMedia(video);
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = command.url;
                } else {
                    statusText.innerText = "Error: HLS Codecs Unsupported on this platform.";
                    statusText.classList.remove('hidden');
                }
            }
        }
    });
</script>
</body>
</html>
