<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embedded Player Engine</title>
    <!-- Core Streaming Decoder Engine -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        video, iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .placeholder {
            color: #7a7a9e;
            font-family: sans-serif;
            font-size: 16px;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>

    <div id="status" class="placeholder">Awaiting SGPC Channel Command...</div>

<script>
    // Automatically parse the URL command string passed by index.html
    const urlParams = new URLSearchParams(window.location.search);
    const mediaType = urlParams.get('type');
    const targetUrl = urlParams.get('url');

    const statusDiv = document.getElementById('status');

    if (mediaType && targetUrl) {
        statusDiv.style.display = 'none';

        if (mediaType === 'youtube') {
            // Option 1 Framework: Native YouTube Embed
            const iframe = document.createElement('iframe');
            iframe.src = targetUrl;
            iframe.setAttribute('allow', 'autoplay; encrypted-media; picture-in-picture');
            iframe.setAttribute('allowfullscreen', 'true');
            document.body.appendChild(iframe);
        } 
        else if (mediaType === 'iptv') {
            // Option 2 Framework: Direct IPTV HLS .m3u8 Decoder Pipeline
            const video = document.createElement('video');
            video.controls = true;
            video.autoplay = true;
            video.setAttribute('playsinline', 'true');
            document.body.appendChild(video);

            if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(targetUrl);
                hls.attachMedia(video);
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = targetUrl;
            } else {
                statusDiv.innerText = "Error: HLS Video Codecs Unsupported on this device.";
                statusDiv.style.display = 'block';
            }
        }
    }
</script>
</body>
</html>
